name: Medosha Mobile Phase 5 APK

on:
  push:
    branches:
      - chatgpt/medosha-mobile-apk
    paths:
      - '.github/workflows/medosha-mobile-phase5.yml'
      - 'mobile-build/phase5/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://wtjykebkwxcwdtauqzsu.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mWZoYBC9zICbE0Coa4OGNQ_tB2GLX41
  EXPO_PUBLIC_MEDOSHA_WEB_URL: https://medosha.net
  EXPO_PUBLIC_MEDOSHA_AI_URL: https://medosha.net

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Phase 4 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/medosha-mobile-src
          mkdir -p /tmp/medosha-mobile-src
          cat mobile-build/v04.part0 mobile-build/v04.part1 mobile-build/v04.part2 > /tmp/v04.b64
          echo '1f03eca91f5ca7720e08680b9c8bfc3e860be70f9eec45c7ef1303424611676b  /tmp/v04.b64' | sha256sum -c -
          base64 -d /tmp/v04.b64 > /tmp/v04.tar.gz
          mkdir -p /tmp/medosha-mobile-src/medosha-app
          tar -xzf /tmp/v04.tar.gz -C /tmp/medosha-mobile-src/medosha-app

      - name: Apply Phase 5 personalized feed patch
        shell: bash
        run: |
          set -euxo pipefail
          cp mobile-build/phase5/HomeScreen.tsx /tmp/medosha-mobile-src/medosha-app/src/screens/HomeScreen.tsx
          cp mobile-build/phase5/App.tsx /tmp/medosha-mobile-src/medosha-app/App.tsx
          cd /tmp/medosha-mobile-src/medosha-app
          node - <<'NODE'
          const fs=require('fs'); const p=require('./package.json'); p.version='0.5.0'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          python3 - <<'PY'
          import json
          p='app.json'; d=json.load(open(p)); d['expo']['version']='0.5.0'; d['expo']['android']['versionCode']=5; d['expo']['ios']['buildNumber']='5'; json.dump(d,open(p,'w'),indent=2); open(p,'a').write('\n')
          PY

      - name: Install dependencies
        working-directory: /tmp/medosha-mobile-src/medosha-app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        working-directory: /tmp/medosha-mobile-src/medosha-app
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: /tmp/medosha-mobile-src/medosha-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: /tmp/medosha-mobile-src/medosha-app/android
        env:
          NODE_ENV: production
          CI: '1'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/medosha-mobile-v0.5-phase5-release.apk"
          sha256sum "$GITHUB_WORKSPACE/medosha-mobile-v0.5-phase5-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medosha-mobile-v0.5-phase5-release-apk
          path: medosha-mobile-v0.5-phase5-release.apk
          if-no-files-found: error
          retention-days: 7
