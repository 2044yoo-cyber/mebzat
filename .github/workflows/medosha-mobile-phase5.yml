name: Medosha Mobile Phase 5 APK

on:
  push:
    branches:
      - chatgpt/medosha-mobile-apk
    paths:
      - '.github/workflows/medosha-mobile-phase5.yml'
      - 'mobile-build/phase5/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://wtjykebkwxcwdtauqzsu.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mWZoYBC9zICbE0Coa4OGNQ_tB2GLX41
  EXPO_PUBLIC_MEDOSHA_WEB_URL: https://medosha.net
  EXPO_PUBLIC_MEDOSHA_AI_URL: https://medosha.net

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified Phase 4 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/medosha-mobile-src
          mkdir -p /tmp/medosha-mobile-src/medosha-app
          cat mobile-build/v04.part0 mobile-build/v04.part1 mobile-build/v04.part2 > /tmp/v04.b64
          echo '1f03eca91f5ca7720e08680b9c8bfc3e860be70f9eec45c7ef1303424611676b  /tmp/v04.b64' | sha256sum -c -
          base64 -d /tmp/v04.b64 > /tmp/v04.tar.gz
          tar -xzf /tmp/v04.tar.gz -C /tmp/medosha-mobile-src/medosha-app
          test -f /tmp/medosha-mobile-src/medosha-app/App.tsx

      - name: Apply Phase 5 social and personalized feed
        shell: bash
        run: |
          set -euxo pipefail
          app=/tmp/medosha-mobile-src/medosha-app
          cp mobile-build/phase5/HomeScreen.tsx "$app/src/screens/HomeScreen.tsx"
          cp mobile-build/phase5/FeedDetailScreen.tsx "$app/src/screens/FeedDetailScreen.tsx"
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('/tmp/medosha-mobile-src/medosha-app')
          p=app/'App.tsx'; s=p.read_text(); s=s.replace('<HomeScreen onOpenPost=', '<HomeScreen session={session} onOpenPost='); p.write_text(s)
          p=app/'package.json'; d=json.loads(p.read_text()); d['version']='0.5.0'; p.write_text(json.dumps(d,indent=2)+'\n')
          p=app/'app.json'; d=json.loads(p.read_text()); d['expo']['version']='0.5.0'; d['expo']['android']['versionCode']=5; d['expo']['ios']['buildNumber']='5'; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          grep -q 'session={session} onOpenPost' "$app/App.tsx"
          grep -q "mode === 'forYou'" "$app/src/screens/HomeScreen.tsx"
          grep -q 'toggleFollow' "$app/src/screens/FeedDetailScreen.tsx"

      - name: Install dependencies
        working-directory: /tmp/medosha-mobile-src/medosha-app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        working-directory: /tmp/medosha-mobile-src/medosha-app
        run: |
          npm install --save-dev @types/node --legacy-peer-deps --no-audit --no-fund
          npx tsc --noEmit

      - name: Generate Android project
        working-directory: /tmp/medosha-mobile-src/medosha-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone Phase 5 release APK
        working-directory: /tmp/medosha-mobile-src/medosha-app/android
        env:
          NODE_ENV: production
          CI: '1'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/medosha-mobile-v0.5-phase5-release.apk"
          sha256sum "$GITHUB_WORKSPACE/medosha-mobile-v0.5-phase5-release.apk"

      - name: Upload Phase 5 APK
        uses: actions/upload-artifact@v4
        with:
          name: medosha-mobile-v0.5-phase5-release-apk
          path: medosha-mobile-v0.5-phase5-release.apk
          if-no-files-found: error
          retention-days: 7
