name: Medosha Mobile APK

on:
  push:
    branches:
      - chatgpt/medosha-mobile-apk
    paths:
      - '.github/workflows/medosha-mobile-apk.yml'
      - 'mobile-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Medosha mobile source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('mobile-build')
          p1 = (root / 'apk.part1.b64').read_text().strip()
          p2 = (root / 'apk.part2.b64').read_text().strip()
          p3 = (root / 'apk.part3.b64').read_text().strip()
          bad = (root / 'apk.part4.b64').read_text().strip()
          expected_part4 = '8598c93ec89fa3c72501f18cb7183977e0ed3b6f905c61df92244f6c6539c694'

          if hashlib.sha256(bad.encode()).hexdigest() == expected_part4:
              p4 = bad
          else:
              p4 = None
              # The connector transfer added exactly six characters to this chunk.
              # Recover only a candidate whose SHA-256 matches the original source chunk.
              for i in range(len(bad) - 5):
                  candidate = bad[:i] + bad[i+6:]
                  if hashlib.sha256(candidate.encode()).hexdigest() == expected_part4:
                      p4 = candidate
                      print(f'Repaired part 4 by removing six inserted characters at offset {i}.')
                      break
              if p4 is None:
                  raise SystemExit('Unable to reconstruct exact part 4; refusing to build altered source.')

          encoded = p1 + p2 + p3 + p4
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected_zip = '97f7d26efb968660da663db68b9ad951515ae6e2b6ce03d476ad2e211dc11f2a'
          if digest != expected_zip:
              raise SystemExit(f'ZIP checksum mismatch: {digest}')
          Path('/tmp/medosha-mobile.zip').write_bytes(raw)
          print('Source ZIP checksum verified:', digest)
          PY
          rm -rf /tmp/medosha-mobile-src
          mkdir -p /tmp/medosha-mobile-src
          unzip -q /tmp/medosha-mobile.zip -d /tmp/medosha-mobile-src
          test -f /tmp/medosha-mobile-src/medosha-app/package.json

      - name: Install JavaScript dependencies
        working-directory: /tmp/medosha-mobile-src/medosha-app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        working-directory: /tmp/medosha-mobile-src/medosha-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: /tmp/medosha-mobile-src/medosha-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/medosha-mobile-v0.2.apk"
          sha256sum "$GITHUB_WORKSPACE/medosha-mobile-v0.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medosha-mobile-v0.2-apk
          path: medosha-mobile-v0.2.apk
          if-no-files-found: error
          retention-days: 7
