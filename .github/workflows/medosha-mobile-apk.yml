name: Medosha Mobile APK

on:
  push:
    branches:
      - chatgpt/medosha-mobile-apk
    paths:
      - '.github/workflows/medosha-mobile-apk.yml'
      - 'mobile-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Medosha mobile source
        shell: bash
        run: |
          set -euxo pipefail
          cat mobile-build/apk.part1.b64 mobile-build/apk.part2.b64 mobile-build/apk.part3.b64 mobile-build/apk.part4.b64 | base64 -d > /tmp/medosha-mobile.zip
          rm -rf /tmp/medosha-mobile-src
          mkdir -p /tmp/medosha-mobile-src
          unzip -q /tmp/medosha-mobile.zip -d /tmp/medosha-mobile-src
          test -f /tmp/medosha-mobile-src/medosha-app/package.json

      - name: Install JavaScript dependencies
        working-directory: /tmp/medosha-mobile-src/medosha-app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        working-directory: /tmp/medosha-mobile-src/medosha-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: /tmp/medosha-mobile-src/medosha-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/medosha-mobile-v0.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medosha-mobile-v0.2-apk
          path: medosha-mobile-v0.2.apk
          if-no-files-found: error
          retention-days: 7
